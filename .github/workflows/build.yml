# Compila Lapsus en los servidores de GitHub (gratis) y publica el APK.
#
# - En cada cambio: comprueba el código, pasa los tests y compila el APK
#   (sin publicar nada).
# - Para publicar una versión nueva: pestaña Actions → "Compilar Lapsus" →
#   "Run workflow" con "Publicar versión" marcado. Crea una Release con el APK
#   listo para instalar desde el móvil (y Obtainium avisa de la actualización).
name: Compilar Lapsus

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      publicar:
        description: 'Publicar versión'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Descargar dependencias
        run: flutter pub get

      - name: Revisar el código
        run: flutter analyze

      - name: Tests
        run: flutter test

      - name: Calcular versión
        id: version
        run: |
          # Versión = MAYOR.MENOR del pubspec + número de compilación.
          base=$(grep '^version:' pubspec.yaml | sed -E 's/version: *([0-9]+)\.([0-9]+).*/\1.\2/')
          echo "name=${base}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Preparar firma
        env:
          LAPSUS_SIGNING_PASSWORD: ${{ secrets.LAPSUS_SIGNING_PASSWORD }}
        run: |
          if [ -z "$LAPSUS_SIGNING_PASSWORD" ]; then
            echo "::warning::Falta el secreto LAPSUS_SIGNING_PASSWORD: el APK se firma con una clave temporal y no se publicará. Mira el README."
            exit 0
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in android/keystore/lapsus.jks.enc \
            -out "$RUNNER_TEMP/lapsus.jks" \
            -pass env:LAPSUS_SIGNING_PASSWORD
          {
            echo "LAPSUS_KEYSTORE_PATH=$RUNNER_TEMP/lapsus.jks"
            echo "LAPSUS_KEYSTORE_PASSWORD=$LAPSUS_SIGNING_PASSWORD"
            echo "LAPSUS_KEY_PASSWORD=$LAPSUS_SIGNING_PASSWORD"
            echo "LAPSUS_KEY_ALIAS=lapsus"
            echo "SIGNED=true"
          } >> "$GITHUB_ENV"

      - name: Compilar APK
        run: |
          flutter build apk --release \
            --build-name=${{ steps.version.outputs.name }} \
            --build-number=${{ steps.version.outputs.code }}
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/Lapsus-${{ steps.version.outputs.name }}.apk"

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Lapsus-${{ steps.version.outputs.name }}
          path: dist/*.apk

      - name: Publicar versión
        if: >-
          env.SIGNED == 'true' &&
          github.event_name == 'workflow_dispatch' &&
          inputs.publicar &&
          github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          printf 'Descarga **Lapsus-%s.apk** desde el móvil e instálalo.\n\n### Cambios\n%s\n' \
            "$VERSION" "$COMMIT_MESSAGE" > notes.md
          gh release create "v$VERSION" dist/*.apk \
            --target "$GITHUB_SHA" \
            --title "Lapsus $VERSION" \
            --notes-file notes.md
